# Pipeline GitLab: verifica, costruisce le tre versioni desktop, pubblica il
# manifesto degli aggiornamenti e la pagina di download su Pages.
#
# Nota sui runner: i tag indicano *dove* deve girare il lavoro. `saas-linux-*`
# sono i runner Linux condivisi e funzionano subito; i runner macOS e Windows di
# GitLab.com vanno abilitati (dipendono dal piano e dalla verifica dell'account).
# Fino ad allora la pipeline si ferma sui due job con `when: manual`, e il resto
# continua a girare: meglio un rilascio parziale con un avviso che una pipeline
# rossa che blocca tutto.
#
# La pipeline GitHub equivalente sta in `.github/workflows/release.yml`. Il
# formato dell'aggiornamento e' identico perche' il manifesto lo genera
# `tool/publish.dart` in entrambi i casi.

stages:
  - verifica
  - costruzione
  - pubblicazione

variables:
  FLUTTER_CHANNEL: stable
  GIT_DEPTH: '0'

default:
  interruptible: true

# --- verifica --------------------------------------------------------------

analisi-e-test:
  stage: verifica
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter analyze
    - flutter test --reporter expanded
  # Il catalogue e' un asset generato: se qualcuno modifica il seed e dimentica
  # di rigenerare il database, il test sul catalogo spedito lo intercetta qui.
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/test-results/*.xml

# --- costruzione -----------------------------------------------------------

macos:
  stage: costruzione
  tags: [saas-macos-medium-m1]
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    - flutter pub get
    - flutter build macos --release
    - cd build/macos/Build/Products/Release
    # `ditto` e non `zip`: e' l'unico strumento che conserva i permessi e i
    # symlink interni di un bundle macOS. Un archivio fatto con `zip` lo rompe e
    # l'applicazione non si apre piu' dopo l'aggiornamento.
    - ditto -c -k --keepParent cpredux.app "$CI_PROJECT_DIR/dist/cpredux-macos.zip"
  artifacts:
    expire_in: 1 month
    paths:
      - dist/cpredux-macos.zip

windows:
  stage: costruzione
  tags: [saas-windows-medium-amd64]
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    - flutter pub get
    - flutter build windows --release
    - New-Item -ItemType Directory -Force -Path dist | Out-Null
    - Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/cpredux-windows.zip
  artifacts:
    expire_in: 1 month
    paths:
      - dist/cpredux-windows.zip

linux:
  stage: costruzione
  image: ghcr.io/cirruslabs/flutter:stable
  dependencies:
    - analisi-e-test
  script:
    - apt-get update && apt-get install -y --no-install-recommends ninja-build libgtk-3-dev libblkid-dev liblzma-dev wget file
    - flutter pub get
    - flutter build linux --release
    - |
      set -euo pipefail
      APP=AppDir
      rm -rf "$APP"; mkdir -p "$APP/usr/bin"
      cp -r build/linux/x64/release/bundle/. "$APP/usr/bin/"
      # L'icona e' obbligatoria per appimagetool: si riusa quella di macOS,
      # cosi' l'icona dell'applicazione resta una sola in tutto il progetto.
      cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png "$APP/cpredux.png"
      printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/cpredux" "$@"\n' > "$APP/AppRun"
      chmod +x "$APP/AppRun"
      cat > "$APP/cpredux.desktop" <<'EOF'
      [Desktop Entry]
      Type=Application
      Name=CPRED Visualizer
      Comment=Scheda del personaggio, campagna e mappa per Cyberpunk RED
      Exec=cpredux
      Icon=cpredux
      Categories=Game;RolePlaying;
      Terminal=false
      EOF
      mkdir -p dist
      wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
      chmod +x /tmp/appimagetool
      # `--appimage-extract-and-run`: dentro un container FUSE non c'e' e
      # l'AppImage non si monterebbe.
      ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "$APP" dist/cpredux-linux.AppImage
  artifacts:
    expire_in: 1 month
    paths:
      - dist/cpredux-linux.AppImage

# --- pubblicazione ---------------------------------------------------------

# Il manifesto e la pagina di download. Girano anche se una delle tre
# costruzioni non e' disponibile: un rilascio per due piattaforme su tre e'
# meglio di nessun rilascio, a patto che il manifesto dica quali ci sono.
pagine:
  stage: pubblicazione
  image: ghcr.io/cirruslabs/flutter:stable
  dependencies:
    - macos
    - windows
    - linux
  script:
    - flutter pub get
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      [ -n "$VERSION" ] || VERSION="0.0.0-sviluppo"
      dart run tool/publish.dart \
        --dist dist \
        --site public \
        --version "$VERSION" \
        --base-url "$CI_PAGES_URL"
  artifacts:
    paths:
      - public
  pages:
    # Pages e' un CDN statico: `latest.json` non va messa in cache, altrimenti
    # un utente potrebbe restare mesi su una versione vecchia.
    publish: public
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual

rilascio:
  stage: pubblicazione
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [macos, windows, linux]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creo il rilascio $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "CPRED Visualizer $CI_COMMIT_TAG"
    description: 'Note di rilascio: vedi site/latest.json, che viene generato dalla stessa esecuzione che costruisce gli archivi.'
    assets:
      links:
        - name: macOS
          url: "$CI_PAGES_URL/cpredux-macos.zip"
        - name: Windows
          url: "$CI_PAGES_URL/cpredux-windows.zip"
        - name: Linux
          url: "$CI_PAGES_URL/cpredux-linux.AppImage"
        - name: Manifesto aggiornamenti
          url: "$CI_PAGES_URL/latest.json"
