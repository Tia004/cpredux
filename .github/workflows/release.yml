# Costruisce, verifica e pubblica le tre versioni desktop.
#
# Perche' GitHub e non solo GitLab: questo file funziona oggi, senza dover
# attivare niente. La pipeline GitLab equivalente sta in `.gitlab-ci.yml` e fa le
# stesse cose; quella che gira davvero dipende da dove vive il repository. Il
# formato dell'aggiornamento non cambia, perche' il manifesto lo genera
# `tool/publish.dart` in entrambi i casi.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verifica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analisi statica
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded

  macos:
    name: macOS
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Archivia il bundle
        run: |
          cd build/macos/Build/Products/Release
          # `ditto` e non `zip`: e' l'unico strumento che conserva i permessi e i
          # symlink interni di un bundle macOS. Un `zip` normale lo rompe e
          # l'applicazione non si apre piu' dopo l'aggiornamento.
          ditto -c -k --keepParent cpredux.app ../../../../../dist/cpredux-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/cpredux-macos.zip

  windows:
    name: Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Archivia la cartella
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/cpredux-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/cpredux-windows.zip

  linux:
    name: Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Costruisci l'AppImage
        # E' il passo piu' delicato della pipeline. L'AppImage serve perche' e' un
        # file singolo: l'aggiornamento automatico sostituisce **quello**, mentre
        # per un pacchetto di distribuzione il file appartiene al gestore di
        # pacchetti e sostituirsi sarebbe sbagliato. Se questo passo fallisce
        # guarda qui per primo: e' l'unico che dipende da uno strumento esterno.
        run: |
          set -euo pipefail
          APP=AppDir
          rm -rf "$APP"
          mkdir -p "$APP/usr/bin"
          cp -r build/linux/x64/release/bundle/. "$APP/usr/bin/"

          # L'icona e' obbligatoria per appimagetool: si riusa quella di macOS,
          # cosi' l'icona dell'applicazione resta una sola in tutto il progetto
          # invece di tre che si contraddicono.
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png "$APP/cpredux.png"

          cat > "$APP/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/cpredux" "$@"
          EOF
          chmod +x "$APP/AppRun"

          cat > "$APP/cpredux.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=CPRED Visualizer
          Comment=Scheda del personaggio, campagna e mappa per Cyberpunk RED
          Exec=cpredux
          Icon=cpredux
          Categories=Game;RolePlaying;
          Terminal=false
          EOF

          mkdir -p dist
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          # `--appimage-extract-and-run`: dentro la CI FUSE non e' disponibile e
          # l'AppImage non si monterebbe.
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "$APP" dist/cpredux-linux.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/cpredux-linux.AppImage

  publish:
    name: pubblica
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Versione
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Va prima di generare il manifesto: il manifesto ha bisogno dell'URL su
      # cui verra' pubblicato, e quell'URL lo conosce solo Pages.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Genera manifesto e cartella del sito
        run: |
          dart run tool/publish.dart \
            --dist dist \
            --site site \
            --version "${{ steps.v.outputs.version }}" \
            --base-url "${{ steps.pages.outputs.base_url }}"

          # La pagina di download e il manifesto stanno sullo stesso dominio: e'
          # la ragione per cui il manifesto non porta URL scritti a mano. Un
          # asset relativo risolto dal manifesto funziona su GitLab, su GitHub e
          # su un dominio tuo, senza ricompilare niente.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Rilascia su GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            site/cpredux-macos.zip
            site/cpredux-windows.zip
            site/cpredux-linux.AppImage
            site/latest.json
          generate_release_notes: true
