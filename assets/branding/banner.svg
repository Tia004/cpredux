<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img"
     aria-label="CPRED Visualizer — strumento non ufficiale per Cyberpunk RED">
  <title>CPRED Visualizer</title>

  <!--
    Il banner del progetto. Disegnato qui e non preso da materiale di R. Talsorian
    Games: la loro Homebrew Content Policy vieta di usare il loro marchio e di
    imitare la veste grafica dei manuali ("no homebrew can mimic our trade dress,
    from layout to font"). Quello che resta possibile e' un aspetto da interfaccia
    cyberpunk — griglia, neon, spigoli tagliati — che e' anche l'aspetto del
    programma, cosi' il banner e l'applicazione si somigliano perche' sono la
    stessa cosa e non perche' citano un manuale.
  -->

  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c11"/>
      <stop offset="1" stop-color="#12161d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24d8e8"/>
      <stop offset="0.5" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#fcee0a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#24d8e8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#void)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Spigoli tagliati: e' la forma che usa ogni riquadro dell'interfaccia. -->
  <path d="M24 8 H1040 L1064 32 V292 H24 Z" fill="none" stroke="#1d222b" stroke-width="2"/>
  <path d="M24 8 H1040 L1064 32" fill="none" stroke="url(#neon)" stroke-width="3"/>
  <path d="M24 292 H900" fill="none" stroke="#fcee0a" stroke-width="2"/>

  <!-- Barra laterale: i tre accenti dell'applicazione. -->
  <rect x="52" y="66" width="7" height="168" fill="#24d8e8"/>
  <rect x="52" y="66" width="7" height="56" fill="#fcee0a"/>

  <!-- Il titolo, con lo sfasamento cromatico. Il testo di sotto e' quello vero:
       quello sfasato e' solo decorazione e non va letto due volte. -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700">
    <text x="86" y="140" font-size="66" letter-spacing="1" fill="#24d8e8" opacity="0.55"
          transform="translate(-3,2)" aria-hidden="true">CPRED VISUALIZER</text>
    <text x="86" y="140" font-size="66" letter-spacing="1" fill="#ff2e88" opacity="0.45"
          transform="translate(3,-2)" aria-hidden="true">CPRED VISUALIZER</text>
    <text x="86" y="140" font-size="66" letter-spacing="1" fill="#fcee0a">CPRED VISUALIZER</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="88" y="180" font-size="15" letter-spacing="6" fill="#8b95a5">SCHEDA · CAMPAGNA · MAPPA DI NIGHT CITY</text>
    <text x="88" y="212" font-size="13" letter-spacing="3" fill="#5b6472">STRUMENTO NON UFFICIALE PER CYBERPUNK RED</text>
  </g>

  <!-- Il segno di stato: la stessa spia che l'applicazione accende quando c'e'
       una sessione aperta. -->
  <g transform="translate(86,236)">
    <rect width="9" height="9" fill="#3ddc84"/>
    <text x="20" y="9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12"
          letter-spacing="2" fill="#8b95a5">DESKTOP · macOS, WINDOWS, LINUX</text>
  </g>
</svg>
